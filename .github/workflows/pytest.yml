name: pytest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every day (testing with 17:00 UTC == 1 PM eastern)
    - cron: '10 17 * * *'

# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  condaenvcreate:
    name: Test Python TESTING ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    container:
      image: ghcr.io/noaa-gfdl/fre-cli:production
      options: "--privileged --cap-add=sys_admin --cap-add=mknod --device=/dev/fuse --security-opt seccomp=unconfined --security-opt label=disable --security-opt apparmor=unconfined" # needed for podman
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Activate fre-cli Environment and install different python versions to test
        run: |
          source /opt/conda/etc/profile.d/conda.sh
          conda deactivate
          conda activate /app/cylc-flow-tools

          #install specfic python version
          conda install -y -p /app/cylc-flow-tools "python=${{ matrix.python-version }}"

          # Add environment path to GITHUB_PATH so changes persist across job steps
          # Ensures the environment will already be activated across steps
          echo "/app/cylc-flow-tools/bin" >> $GITHUB_PATH

      - name: Install packages needed to test: pytest-cov, c++ compiler
        run: |
          #pytest-cov needed for testing
          #c++ compiler needed for cartopy for analysis script installation tests
          #podman and apptainer needed to run fre make compilation tests
          conda install -y -p /app/cylc-flow-tools -c conda-forge pytest-cov cxx-compiler

      - name: Install podman (to-do: and apptainer)
        run: |
          #podman and apptainer needed to run fre make compilation tests
          apt-get update
          apt-get install -y --no-install-recommends podman 
 
      - name: Install the fre-cli
        run: |
          #install fre
          python -m pip install .

      - name: Verify Python/fre-cli/pytest-cov Installation
        run: |
          echo "Python version installed: "
          conda list -p /app/cylc-flow-tools

      - name: Run pytest In fre-cli env
        run: |
          echo "adding spack installed binaries of netcdf/hdf5 to front of path, so conda installed ones don't break compilation tests"
          export PATH="/opt/views/view/bin:$PATH"
          echo "PATH is $PATH"

          echo "running pytest, will print 20 longest durations"
          python -m pytest --durations=20 --log-level DEBUG --cov-report=xml --cov-config=coveragerc --cov=fre fre/

      - name: Install gpg for Codecov upload
        run: | 
          apt-get update
          apt-get install -y gnupg

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          files: coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
