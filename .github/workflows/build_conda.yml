name: build_conda

# 1. conda-build v26.9.1 caused an error in the build related to
#    "AttributeError" when looking for certain conda plugins.
#    Don't think plugins are needed here
# 2. Conda-build version uses a default solver "libmamba" but container
#    being used does not support that conda solver backend
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
#  CONDA_NO_PLUGINS: true
#  CONDA_SOLVER: libmamba

on:
  pull_request:
    branches:

# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  condabuild:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noaa-gfdl/fre-cli:miniconda24_gcc14_v2
    steps:
      - name: Checkout Files
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configure Conda
        run: |
          echo "removing conda default channels, appending open-source ones"
          conda config --append channels conda-forge
          conda config --append channels noaa-gfdl
          conda config --append channels ufs-community
          conda config --remove channels defaults

          echo "setting strict channel priority"
          conda config --set channel_priority strict

          echo "setting anaconda_upload to no"
          conda config --set anaconda_upload no

          echo "printing conda config just in case"
          conda config --show

      - name: Conda install libmamba conda solver
        run: |
          conda install -n base -c conda-forge conda-libmamba-solver libmambapy libmamba
          conda config --set solver libmamba

      - name: Conda install conda-build
        timeout-minutes: 10
        run: |
          echo "conda install conda-build"
          conda install conda-forge::conda-build

      - name: Check conda-build version and supported package formats
        run: |
          conda --version
          conda build --version
          conda build --help 

      - name: Build fre-cli Conda Package
        timeout-minutes: 20
        run: |
          echo "conda building fre-cli package and outputting as a tarball"
          mkdir -p /app/fre-cli-tarball
          conda -v build --no-test --package-format .conda --output-folder /app/fre-cli-tarball .

      - name: Upload fre-cli Tarball
        uses: actions/upload-artifact@v4
        with:
          name: fre-cli-tarball
          path: /app/fre-cli-tarball/noarch/fre-cli-*.conda
          if-no-files-found: error

  testbuild:
    needs: condabuild
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noaa-gfdl/fre-cli:miniconda24_gcc14_v2
    steps:
      - name: Configure Conda
        run: |
          echo "removing conda default channels, appending open-source ones"
          conda config --append channels conda-forge
          conda config --append channels noaa-gfdl
          conda config --append channels ufs-community
          conda config --remove channels defaults

          echo "setting strict channel priority"
          conda config --set channel_priority strict

          echo "setting anaconda_upload to no"
          conda config --set anaconda_upload no

          echo "printing conda config just in case"
          conda config --show

      - name: Conda install libmamba conda solver
        run: |
          conda install -n base -c conda-forge conda-libmamba-solver libmambapy libmamba
          conda config --set solver libmamba

      - name: Conda install conda-build
        run: |
          echo "conda install conda-build"
          conda install conda-forge::conda-build

      - name: Check conda-build version and supported package formats
        run: |
          conda --version
          conda build --version
          conda build --help

      - name: Download tarball
        uses: actions/download-artifact@v5
        with:
          name: fre-cli-tarball
          path: /app/fre-cli-tarball/noarch

      - name: Test fre-cli conda package
        timeout-minutes: 20
        run: |
          pkg=$(find /app/fre-cli-tarball/noarch -name 'fre-cli-*.conda' | head -n 1)

          if [ -z "$pkg" ]; then
              echo "Could not find uploaded fre-cli conda package"
              exit 1
          fi

          echo "Testing the package: $pkg"
          # plugins conflict with conda build test 
          export CONDA_NO_PLUGINS=true
          conda -v build --test "$pkg"

