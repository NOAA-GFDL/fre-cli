name: AI Pytest Workflow

on:
  pull_request:
    branches: [ main ]
  # schedule:
  #   - cron: '0 0 * * *' # Runs once a day at midnight

jobs:
  ai-pytest-check:
    runs-on: ubuntu-latest
    
    # Required for conda-incubator to work correctly in the runner
    defaults:
      run:
        shell: bash -el {0} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,noaa-gfdl
          python-version: 3.14
          conda-remove-defaults: true
          environment-file: environment.yml
          activate-environment: fre-cli

      - name: Install fre-cli (Developer Style)
        run: |
          # Upgrade pip and install standard test requirements
          python -m pip install --upgrade pip
          pip install pytest
          
          # Editable pip install as requested
          pip install -e .

      - name: Run Pytest and capture output
        run: |
          # Run pytest and pipe output to a file. 
          # Using `|| true` ensures the workflow continues even if tests fail/warn.
          pytest > pytest_output.log 2>&1 || true
          
          echo "Captured Pytest Output:"
          cat pytest_output.log

      - name: Setup GitHub Copilot CLI
        env:
          # A token is required to authenticate the GitHub CLI extension
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The GitHub CLI (gh) is pre-installed on standard Ubuntu runners.
          # We install the official Copilot extension here.
          gh extension install github/gh-copilot
          
          echo "Testing Copilot Help Command:"
          gh copilot -- --help

      - name: Query Copilot for Fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the pytest output into a variable
          # You might want to filter this with grep if the log is too long for the prompt limit
          TEST_OUTPUT=$(cat pytest_output.log | grep -B 5 -A 5 'warn')
          
          echo "Feeding pytest output to Copilot..."
          
          # Pass the prompt and the context to Copilot
          # Note: `gh copilot suggest` is usually interactive, but we feed it as a single string here
          gh copilot --prompt "Fix these warnings/errors from pytest: \n\n ${TEST_OUTPUT}" --add-dir "${PWD}" --allow-all --attachment pytest_output.log --attachment .github/copilot-instructions.md --model 'Claude Sonnet 4.6' --mode 'autopilot'
          
