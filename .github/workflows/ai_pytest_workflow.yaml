name: AI Pytest Workflow

on:
  pull_request:
    branches: [ main ]
  # schedule:
  #   - cron: '0 0 * * *' # Runs once a day at midnight

jobs:
  ai-pytest-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch recent workflow logs from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the ID of the most recent workflow run on the main branch.
          # Note: If you want logs from a *specific* workflow, add `--workflow "Your Workflow Name"` to this command.
          RUN_ID=$(gh run list --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
          
          if [ -z "$RUN_ID" ]; then
            echo "No recent runs found on the main branch."
            exit 1
          fi
          
          echo "Fetching logs for Run ID: $RUN_ID"
          
          # Download the logs and pipe output to a file. 
          # Using `|| true` ensures the workflow continues even if the command has a hiccup.
          gh run view $RUN_ID --log > pytest_output.log || true
          
          echo "Captured Logs Preview:"
          head -n 20 pytest_output.log

      - name: Setup GitHub Copilot CLI
        env:
          # A token is required to authenticate the GitHub CLI extension
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The GitHub CLI (gh) is pre-installed on standard Ubuntu runners.
          # We install the official Copilot extension here.
          gh extension install github/gh-copilot
          
          echo "Testing Copilot Help Command:"
          gh copilot -- --help

      - name: Query Copilot for Fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the pytest output into a variable
          # Filtering with grep for warnings/errors (case-insensitive) to stay within the prompt limit
          TEST_OUTPUT=$(cat pytest_output.log | grep -i -E -B 5 -A 5 'warn|error|fail')
          
          echo "Feeding workflow logs to Copilot..."
          
          # Pass the prompt and the context to Copilot
          # Note: `gh copilot suggest` is usually interactive, but we feed it as a single string here
          gh copilot --prompt "Fix these warnings/errors from the recent test run: \n\n ${TEST_OUTPUT}" --add-dir "${PWD}" --allow-all --attachment pytest_output.log --attachment .github/copilot-instructions.md --model 'Claude Sonnet 4.6' --mode 'autopilot'
