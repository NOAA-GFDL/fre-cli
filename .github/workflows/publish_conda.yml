name: publish_conda

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Run this action on pushes to main or after the update-tag action has run.
# We detect the latter case by a closed pull request on a main push
#   AND the if-condition that checks that the source branch is the
#   one triggered by the update-tag reference changes.
# The "Set version for tagged release" is needed to inform conda-build
#   of the tag. Because there are intermediate commits (the updated version refs)
#   the commit no longer is tagged. So we can retrieve the package version
#   from __init__.py.
on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  condapublish:
    if: |
      github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.merged == true &&
         startsWith(github.event.pull_request.head.ref, 'update-version-post-release'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noaa-gfdl/fre-cli:miniconda24_gcc14_v2
    steps:
      - name: Checkout Files
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # For tagged releases, remove the '-dev' suffix that the update-tag action appends
      # from the version in __init__.py (in this checkout only), so that the packaged
      # fre-cli reports the tag with `fre --version`.
      # Then make the tag available for the conda-build steps by setting the env var
      # $GIT_DESCRIBE_TAG, which meta.yaml uses as the conda package version.
      # $GITHUB_ENV is a special file path provided by the Actions runner.
      # When you write KEY=VALUE lines into it, those variables become available
      # as environment variables for all subsequent steps in the same job.
      - name: Set version for tagged release
        if: github.event_name == 'pull_request'
        run: |
          sed -i "s/^\(version = \"[^\"]*\)-dev\"/\1\"/" fre/__init__.py
          grep '^version = ' fre/__init__.py
          VERSION=$(python3 -c "
          import re
          content = open('fre/__init__.py').read()
          m = re.search(r'^version = \"([^\"]+)\"', content, re.M)
          print(m.group(1))
          ")
          case "$VERSION" in
            ""|*-dev)
              echo "ERROR: release version '$VERSION' is empty or still ends in '-dev'"
              exit 1 ;;
          esac
          echo "GIT_DESCRIBE_TAG=$VERSION" >> $GITHUB_ENV

      - name: Configure Conda
        run: |
          echo "removing conda default channels, appending open-source ones"
          conda config --append channels conda-forge
          conda config --append channels noaa-gfdl
          conda config --append channels ufs-community
          conda config --remove channels defaults

          echo "setting strict channel priority"
          conda config --set channel_priority strict

          echo "setting anaconda_upload to yes"
          conda config --set anaconda_upload yes

          echo "printing conda config just in case"
          conda config --show

      ## commenting this out for now - with this update, conda wants to use the libmamba
      #  solver for the envrionment BUT the container we're pulling needs to be updated to
      #  support this conda update
      #  Want to keep this in for now as a reminder that we can update the container...
      #- name: Update Conda and Conda Package Indices
      #  run: |
      #    echo "updating conda and package channel indices for conda-forge, noaa-gfdl"
      #    conda update -y conda
      #    conda update -y --all --override-channels -c conda-forge
      #    conda update -y --all --override-channels -c noaa-gfdl

      - name: Conda install and set libmamba conda solver
        run: |
          conda install -n base -c conda-forge conda-libmamba-solver=25.* libmambapy libmamba
          conda config --set solver libmamba

      - name: Conda install conda-build
        run: |
          echo "conda install conda-build"
          conda install conda-forge::conda-build conda-forge::anaconda-client

      - name: Build fre-cli Conda Package
        run: |
          echo "conda building fre-cli package and outputting as a tarball"
          export ANACONDA_API_TOKEN=${{ secrets.ANACONDA_TOKEN }}
          conda build .

      - name: Trigger container image build workflow
        if: ${{ success() }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-conda-succeeded
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "tag": "${{ github.ref_name }}"
            }
