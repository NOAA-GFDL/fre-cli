  # amip
  EXP_AMIP_START:     "1979"
  EXP_AMIP_END:       "2020"
  ANA_AMIP_START:     "1980"
  ANA_AMIP_END:       "2020"

  PP_AMIP_CHUNK96:    "P1Y"
  PP_AMIP_CHUNK384:   "P1Y"
  PP_XYINTERP96:      "180,288"
  PP_XYINTERP384:     "720,1152"

  # cmor
  CMOR_START: 
