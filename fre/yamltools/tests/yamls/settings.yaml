#to-do: work on being able to overwrite these if necessary?
fre_properties:
  PP_AMIP_CHUNK96:    "P1Y"

directories:
  history_dir:  "fre/tests/test_files/ascii_files/mock_archive/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}/{{ platform }}-{{ target }}/history"
  pp_dir:       "fre/tests/test_files/ascii_files/mock_archive/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}/{{ platform }}-{{ target }}/pp"
  analysis_dir: "fre/tests/test_files/ascii_files/mock_nbhome/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}"
  ptmp_dir:     "fre/tests/test_files/ascii_files/mock_xtmp/$USER/ptmp"
#  fre_analysis_home: "/home/fms/local/opt/fre-analysis/test"

# shared pp settings
postprocess: 
  settings:
    history_segment:    "P1Y"
    site:               "ppan"
    pp_start:   "{{ fre_properties.ANA_AMIP_START }}"
    pp_stop:    "{{ fre_properties.ANA_AMIP_END }}"
    pp_chunks:
      - "{{ fre_properties.PP_AMIP_CHUNK96 }}"
    pp_grid_spec: "{{ fre_properties.GRID_SPEC96 }}"
  switches:
    clean_work:         True
    do_atmos_plevel_masking: True
