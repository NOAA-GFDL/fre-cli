# local reusable variable overrides
fre_properties:
  custom_interp_test: "200,200"

postprocess:
  components:
    atmos_cmip-TEST:
      sources:
        - history_file: "atmos_month_cmip"
        - history_file: "atmos_8xdaily_cmip"
        - history_file: "atmos_daily_cmip"
      sourceGrid: "cubedsphere"
      xyInterp: "{{ fre_properties.custom_interp_test }}"
      interpMethod: "conserve_order2"
      inputRealm: 'atmos'
      postprocess_on: False
    atmos-TEST:
      sources:
        - history_file: "atmos_month"
      sourceGrid: "cubedsphere"
      xyInterp: "{{ fre_properties.PP_XYINTERP96 }}"
      interpMethod: "conserve_order2"
      inputRealm: 'atmos'
      postprocess_on: False
    atmos_level_cmip-TEST:
      sources:
        - history_file: "atmos_level_cmip"
      sourceGrid: "cubedsphere"
      xyInterp: "{{ fre_properties.PP_XYINTERP96 }}"
      interpMethod: "conserve_order2"
      inputRealm: 'atmos'
      postprocess_on: False
