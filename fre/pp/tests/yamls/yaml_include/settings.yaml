directories:
  history_dir:  "/archive/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}/{{ platform }}-{{ target }}/history"
  refined_history_dir:  "/archive/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}/{{ platform }}-{{ target }}/history_dir_refined"
  pp_dir:       "/archive/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}/{{ platform }}-{{ target }}/pp"
  analysis_dir: "/nbhome/$USER/{{ fre_properties.FRE_STEM }}/{{ name }}"
  ptmp_dir:     "/xtmp/$USER/ptmp"

postprocess:
  settings:
    history_segment:    "P1Y"
    site:               "ppan"
    pp_start:   "{{ fre_properties.ANA_AMIP_START }}"
    pp_stop:    "{{ fre_properties.ANA_AMIP_END }}"
    pp_chunks:
      - "{{ fre_properties.PP_AMIP_CHUNK96 }}"
    pp_grid_spec: "{{ fre_properties.GRID_SPEC96 }}"
  switches:
    clean_work:              True
    do_atmos_plevel_masking: True
  preanalysis:
    vitals:
      script: "/path/to/vitals-script"
      inputs: ['atmos_month', 'aerosol_month']
      do_preanalysis: True
  refinediag:
    ocean:
      script: "/path/to/ocean-script"
      inputs: ['ocean_monthly', 'ocean_bgc']
      outputs: ['ocean_refined']
      do_refinediag: True
    aerosol:
      script: "/path/to/aerosol-script"
      inputs: ['aerosol_month']
      outputs: ['aerosol_refined']
      do_refinediag: True
